databases: []

services:
  - type: web
    name: meditracex-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python database/init_db.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_TYPE
        value: sqlite
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
