version: '3.8'

services:
  # 1. Production-Grade MySQL 8.0 Database Container
  mysql:
    image: mysql:8.0
    container_name: meditracex_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password_2026
      MYSQL_DATABASE: meditracex_db
      MYSQL_USER: meditracex_user
      MYSQL_PASSWORD: meditracex_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MediTraceX FastAPI Backend Container
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meditracex_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DB_TYPE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: meditracex_db
      MYSQL_USER: meditracex_user
      MYSQL_PASSWORD: meditracex_password_2026
      SECRET_KEY: meditracex-super-secret-production-jwt-key-2026
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  mysql_data:
