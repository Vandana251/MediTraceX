<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediTraceX</title>
  <script>
    // If the path contains /app, redirect to /app/
    var path = window.location.pathname;
    if (path.indexOf('/app') !== -1) {
      window.location.replace('/MediTraceX/app/' + window.location.hash);
    } else {
      window.location.replace('/MediTraceX/' + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Redirecting to MediTraceX...</p>
</body>
</html>
